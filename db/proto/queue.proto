syntax = "proto3";

package queue_pb;

option go_package = "github.com/memocash/index/db/proto/queue_pb";

service Queue {
  rpc SaveMessages (Messages) returns (ErrorReply) {
  }
  rpc DeleteMessages (MessageUids) returns (ErrorReply) {
  }
  rpc GetMessage (RequestSingle) returns (Message) {
  }
  rpc GetMessages (Request) returns (Messages) {
  }
  // Deprecated: use GetFiltered, which subsumes prefix queries (a prefix is
  // the pattern arm {uid: {parts: [prefix], anchor_start: true}}).
  rpc GetByPrefixes (RequestPrefixes) returns (Messages) {
    option deprecated = true;
  }
  rpc GetFiltered (FilterRequest) returns (Messages) {
  }
  rpc GetStreamMessages(RequestStream) returns (stream Message) {
  }
  rpc GetTopicList (EmptyRequest) returns (TopicListReply) {
  }
  rpc GetMessageCount (CountRequest) returns (TopicCount) {
  }
  rpc CompactAll (EmptyRequest) returns (ErrorReply) {
  }
}

message Messages {
  repeated Message messages = 1;
}

message Message {
  bytes uid = 1;
  string topic = 2;
  bytes message = 3;
  int64 timestamp = 4;
}

message ErrorReply {
  string error = 1;
}

message MessageUids {
  string topic = 1;
  repeated bytes uids = 2;
}

message RequestSingle {
  string topic = 1;
  bytes uid = 2;
}

message Request {
  string topic = 1;
  repeated bytes uids = 5;
}

message RequestStream {
  string topic = 1;
  repeated bytes prefixes = 2;
}

message EmptyRequest {
}

message Topic {
  string name = 1;
  uint64 count = 2;
}

message TopicListReply {
  repeated Topic topics = 1;
}

message CountRequest {
  string topic = 1;
  bytes prefix = 2;
}

message TopicCount {
  uint64 count = 1;
}

message RequestPrefixes {
  string topic = 1;
  repeated RequestPrefix prefixes = 2;
  uint32 limit = 3;
  Order order = 4;
}

enum Order {
  ASC = 0;
  DESC = 1;
}

message RequestPrefix {
  bytes prefix = 1;
  bytes start = 2;
  uint32 limit = 3;
}

message FilterRequest {
  string topic = 1;
  repeated FilterPattern patterns = 2;
  uint32 limit = 3;
  Order order = 4;
}

// FilterPattern is one arm of a filtered get; arms are returned in order.
// Callers page keyset-style: asc resumes with start = last returned uid +
// 0x00, desc resumes with start = last returned uid; a short page = range
// exhausted.
message FilterPattern {
  Pattern uid = 1;
  Pattern data = 2;
  bytes start = 3; // asc: inclusive lower bound; desc: exclusive upper bound
  uint32 limit = 4;
}

// Pattern parts are matched in order with arbitrary gaps between them (LIKE with %):
//   prefix  X%   => parts:[X], anchor_start
//   contains %X% => parts:[X]
//   suffix  %X   => parts:[X], anchor_end
//   A%B          => parts:[A,B], anchor_start, anchor_end
// A pattern with no parts matches everything.
message Pattern {
  repeated bytes parts = 1;
  bool anchor_start = 2;
  bool anchor_end = 3;
}
